[package]
name = "rust-game-engine"
description = ""
version = "0.1.0"
edition = "2021"

[lib]
path = "./src/lib.rs"

[[bin]]
name = "test-game"
path = "./src/bin/main/main.rs"

[dependencies]
anyhow = "1.0"
bitmask-enum = "2.1.0"
cfg-if = "1"
bytemuck = { version = "1.12", features = ["derive"] }
bytemuck_derive = { version = "^1.10.1" } # explicitly pin this above 1.10.1 which fixed a warning
derive_more = "0.99.17"
# encase = { version = "0.10.0", features = ["glam"] }
env_logger = "0.11.5"
getrandom = "0.3.1"
glam = { version = "0.29.2", features = ["scalar-math", "bytemuck"] }
glob = "0.3.1"
pollster = "0.2"
itertools = "0.12"
asefile = { version = "0.3", features = ["utils"] }
notify = "5.1.0"
rand = "0.8.5"
tobj = { version = "3.2", features = ["log"] }
msdfgen = "0.2.1"
ttf-parser = "0.18"
log = "0.4.19"
wgpu = "27"
winit = {  version = "0.30.5", features = ["rwh_05"] }
slotmap = "1.0.7"

controlset-derive = { path = "./controlset-derive" }
shadertype-derive = { path = "./shadertype-derive" }
egui = "0.33.0"
egui-wgpu = "0.33.0"
egui-winit = "0.33.0"
konst = { version = "0.3", features = ["alloc"] }
const_panic = "0.2"
# const_format = "0.2.34"


[dependencies.image]
# this could be updated but asefile is stuck on an older version and hasn't been updated
version = "0.24.9"
default-features = false
features = ["png", "jpeg", "tga"]

# [patch.'https://github.com/ktravis/naga-to-tokenstream']
# naga-to-tokenstream = {path = "../naga-to-tokenstream" }

[build-dependencies]
# generate-wgsl-oil = {path = "../generate-wgsl-oil/", features = ["bytemuck", "glam", "prettyplease"] }
generate-wgsl-oil = { git = "https://github.com/ktravis/generate-wgsl-oil", features = ["bytemuck", "glam", "prettyplease"] }

[profile.dev.package.asefile]
opt-level = 2  # or 3
